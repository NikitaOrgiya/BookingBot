name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Ни одна из переменных ниже не является рабочим секретом — это
# плейсхолдеры, нужные только потому, что lib/env.ts (Zod) требует полный
# набор переменных при любом обращении к process.env (typecheck/build
# используют модули, которые их импортируют). CI не использует
# production secrets ни здесь, ни в одной из jobs ниже.
#
# Версия Supabase CLI закреплена одним значением (SUPABASE_CLI_VERSION) и
# переиспользуется во всех jobs — то же значение, что установлено как
# devDependency "supabase" в package.json и использовалось при локальной
# разработке этого этапа.
env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_0000000000
  SUPABASE_SECRET_KEY: sb_secret_ci_placeholder_00000000000000000000
  TELEGRAM_BOT_TOKEN: "000000:ci-placeholder-token"
  TELEGRAM_BOT_USERNAME: ci_placeholder_bot
  TELEGRAM_WEBHOOK_SECRET: ci_placeholder_webhook_secret_000000
  CRON_SECRET: ci-placeholder-cron-secret-00000000
  SUPABASE_CLI_VERSION: "2.109.1"

jobs:
  # Обязательная job: lint, typecheck, unit-тесты, production build.
  lint-typecheck-unit-build:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  # Обязательная job: SQL/pgTAP + integration-тесты на обычном PostgreSQL —
  # тот же подход, что и scripts/test-sql.sh локально (см. README, раздел
  # "Локальная проверка миграций"): scripts/sql/local_bootstrap.sql создаёт
  # anon/authenticated/service_role и заглушку схемы auth, реальный
  # Supabase-проект их уже предоставляет "из коробки".
  #
  # PostgreSQL устанавливается и запускается ПРЯМО НА РАННЕРЕ (не как
  # services: postgres — тот работает в отдельном Docker-контейнере со
  # своей файловой системой, и postgresql-16-pgtap, поставленный apt-get на
  # раннере, физически не виден внутри контейнера — именно так упал первый
  # реальный прогон этого workflow: "extension pgtap is not available").
  sql-and-integration:
    name: SQL/pgTAP + integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bookingbot_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - name: Install PostgreSQL 16 + pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgtap

      - name: Start PostgreSQL and set postgres role password
        run: |
          sudo service postgresql start
          sudo -u postgres psql -c "alter user postgres password 'postgres';"

      - name: SQL / pgTAP tests
        run: npm run test:sql

      - name: Integration tests
        run: npm run test:integration

  # Обязательная job: применяет все миграции + seed.sql "с нуля" на
  # настоящем локальном Supabase-стеке через сам Supabase CLI (Docker,
  # доступен на стандартных GitHub-hosted runners), затем прогоняет
  # pgTAP-тесты штатной командой CLI (`supabase test db`). Ловит проблемы,
  # которые bare-PostgreSQL проверка выше в принципе не видит. --local
  # гарантирует, что это никогда не может задеть production-проект;
  # секреты не нужны. Стек всегда останавливается в конце (if: always()),
  # даже если reset/тесты упали.
  supabase-db-reset:
    name: supabase start + db reset + pgTAP (Supabase CLI, local stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: supabase start
        run: supabase start

      - name: supabase db reset --local
        run: supabase db reset --local

      - name: supabase test db
        run: supabase test db

      - name: supabase stop
        if: always()
        run: supabase stop --no-backup

  # Обязательная job: полный E2E-прогон Playwright против настоящего
  # локального Supabase Auth (не production, не заглушка). Падение любого
  # сценария или отсутствие обязательных E2E-переменных блокирует PR — в
  # отличие от локального ручного запуска без Docker/Supabase (там
  # tests/e2e/env.ts осознанно пропускает тесты, см. tests/e2e/README.md),
  # в CI (process.env.CI задаётся GitHub Actions автоматически)
  # tests/e2e/env.ts:getE2eEnv() бросает ошибку вместо skip, а шаг
  # "Verify Supabase connection details" ниже — дополнительная,
  # независимая проверка того же на уровне workflow.
  playwright:
    name: Playwright E2E (local Supabase stack)
    runs-on: ubuntu-latest
    needs: [lint-typecheck-unit-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: supabase start
        run: supabase start

      - name: Read local Supabase connection details
        id: supabase_status
        run: |
          supabase status -o json > /tmp/supabase-status.json
          {
            echo "url=$(jq -r '.API_URL' /tmp/supabase-status.json)"
            echo "anon_key=$(jq -r '.ANON_KEY' /tmp/supabase-status.json)"
            echo "service_role_key=$(jq -r '.SERVICE_ROLE_KEY' /tmp/supabase-status.json)"
            echo "db_url=$(jq -r '.DB_URL' /tmp/supabase-status.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Supabase connection details were extracted
        run: |
          missing=0
          check() {
            name="$1"; value="$2"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::${name} was not obtained from 'supabase status' — local Supabase did not start correctly."
              missing=1
            fi
          }
          check "API_URL" "${{ steps.supabase_status.outputs.url }}"
          check "ANON_KEY" "${{ steps.supabase_status.outputs.anon_key }}"
          check "SERVICE_ROLE_KEY" "${{ steps.supabase_status.outputs.service_role_key }}"
          check "DB_URL" "${{ steps.supabase_status.outputs.db_url }}"
          if [ "$missing" = "1" ]; then
            echo "::error::Required E2E Supabase connection details are missing — failing the job instead of letting E2E tests silently skip."
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          E2E_SUPABASE_URL: ${{ steps.supabase_status.outputs.url }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase_status.outputs.service_role_key }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase_status.outputs.anon_key }}
          TEST_DATABASE_URL: ${{ steps.supabase_status.outputs.db_url }}
        run: npm run test:e2e

      - name: Verify E2E results (zero skipped, zero failed, expected count executed)
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const EXPECTED_TOTAL = 12;
            const report = JSON.parse(fs.readFileSync("playwright-report/results.json", "utf8"));
            let total = 0, passed = 0, failed = 0, skipped = 0;
            function walk(suite) {
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  total += 1;
                  if (test.status === "expected") passed += 1;
                  else if (test.status === "skipped") skipped += 1;
                  else failed += 1; // "unexpected" or "flaky" — both indicate a real problem
                }
              }
              for (const s of suite.suites || []) walk(s);
            }
            for (const s of report.suites || []) walk(s);
            console.log(`E2E results: total=${total} passed=${passed} failed=${failed} skipped=${skipped} (expected total >= ${EXPECTED_TOTAL})`);
            let ok = true;
            if (skipped > 0) { console.error(`FAIL: ${skipped} test(s) skipped — E2E must not be skipped in CI.`); ok = false; }
            if (failed > 0) { console.error(`FAIL: ${failed} test(s) failed/flaky.`); ok = false; }
            if (total < EXPECTED_TOTAL) { console.error(`FAIL: only ${total} test(s) executed, expected at least ${EXPECTED_TOTAL}.`); ok = false; }
            if (!ok) process.exit(1);
            console.log("OK: all expected E2E tests executed and passed, zero skipped, zero failed.");
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: supabase stop
        if: always()
        run: supabase stop --no-backup
